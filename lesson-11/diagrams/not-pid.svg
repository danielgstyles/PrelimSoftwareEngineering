<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Inter, sans-serif" role="img" aria-label="Our own build: the pick-and-place trigger is a closed loop on/off system, while the Lesson 19 movement function is an open loop sequence with no measurement.">
  <defs>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFB347"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6B6B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="430" fill="#0D1B2A"/>

  <!-- ===================== row 1 — pick and place ===================== -->
  <text x="40" y="34" fill="#FFB347" font-size="15" font-weight="700">Lessons 17–18 · the pick-and-place trigger</text>

  <g fill="#16283B" stroke="#FFB347" stroke-width="2">
    <rect x="40" y="52" width="180" height="58" rx="4"/>
    <rect x="270" y="52" width="210" height="58" rx="4"/>
    <rect x="530" y="52" width="180" height="58" rx="4"/>
    <rect x="760" y="52" width="200" height="58" rx="4"/>
  </g>
  <g fill="#F0F6FF" font-size="13.5" text-anchor="middle">
    <text x="130" y="77">The LDR reads</text><text x="130" y="95">the light on the pad</text>
    <text x="375" y="77">Is the reading past</text><text x="375" y="95">the threshold?</text>
    <text x="620" y="77">Run the</text><text x="620" y="95">pick-up routine</text>
    <text x="860" y="77">The arm lifts</text><text x="860" y="95">the object off the pad</text>
  </g>
  <g stroke="#FFB347" stroke-width="2" fill="none" marker-end="url(#arr-amber)">
    <line x1="222" y1="81" x2="264" y2="81"/>
    <line x1="482" y1="81" x2="524" y2="81"/>
    <line x1="712" y1="81" x2="754" y2="81"/>
  </g>
  <path d="M860,112 L860,148 L130,148 L130,114" stroke="#FFB347" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arr-amber)"/>
  <text x="495" y="141" fill="#FFB347" font-size="12.5" text-anchor="middle" font-family="Space Mono, monospace">the pad is read again on the very next pass of the loop</text>

  <rect x="40" y="164" width="920" height="40" fill="#122335" rx="4"/>
  <text x="58" y="189" fill="#F0F6FF" font-size="13.5">Two states, switching at a threshold — <tspan fill="#FFB347" font-weight="700">on/off (bang-bang) control</tspan>. The pad is measured and the action depends on it — <tspan fill="#FFB347" font-weight="700">closed loop on pad occupancy</tspan>.</text>

  <line x1="40" y1="230" x2="960" y2="230" stroke="#1E3A52" stroke-width="1.5"/>

  <!-- =================== row 2 — move(start, end) ==================== -->
  <text x="40" y="266" fill="#FF6B6B" font-size="15" font-weight="700">Lesson 19 · move(start, end) — the smoothing function</text>

  <g fill="#16283B" stroke="#FF6B6B" stroke-width="2">
    <rect x="40" y="284" width="170" height="58" rx="4"/>
    <rect x="260" y="284" width="170" height="58" rx="4"/>
    <rect x="480" y="284" width="170" height="58" rx="4"/>
    <rect x="700" y="284" width="170" height="58" rx="4"/>
  </g>
  <g fill="#F0F6FF" font-size="13.5" text-anchor="middle">
    <text x="125" y="309">Start angle</text><text x="125" y="327">(where we think we are)</text>
    <text x="345" y="309">Step 1 of ~100</text><text x="345" y="327">write the next angle</text>
    <text x="565" y="309">…step 99, step 100</text><text x="565" y="327">write, wait, write</text>
    <text x="785" y="309">End angle</text><text x="785" y="327">(where we hope we are)</text>
  </g>
  <g stroke="#FF6B6B" stroke-width="2" fill="none" marker-end="url(#arr-red)">
    <line x1="212" y1="313" x2="254" y2="313"/>
    <line x1="432" y1="313" x2="474" y2="313"/>
    <line x1="652" y1="313" x2="694" y2="313"/>
  </g>
  <text x="880" y="318" fill="#FF6B6B" font-size="13" font-family="Space Mono, monospace">and stop.</text>

  <rect x="40" y="356" width="920" height="58" fill="#122335" rx="4"/>
  <text x="58" y="380" fill="#F0F6FF" font-size="13.5">No sensor, no measurement, no error, and <tspan fill="#FF6B6B" font-weight="700">no path back to the start</tspan> — the arm's real position is never checked at any step.</text>
  <text x="58" y="402" fill="#F0F6FF" font-size="13.5">This is <tspan fill="#FF6B6B" font-weight="700">open loop interpolation</tspan>: it smooths the path between two known points. It is not PID, and it is not closed loop.</text>
</svg>
