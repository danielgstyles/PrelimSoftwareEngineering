<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Inter, sans-serif" role="img" aria-label="Two charts: without a tolerance band the actuator switches very rapidly at the setpoint, with a band it switches slowly between the two edges of the band.">
  <rect x="0" y="0" width="1000" height="360" fill="#0D1B2A"/>

  <!-- ========================= left: no band ========================= -->
  <g>
    <text x="40" y="32" fill="#FF6B6B" font-size="15" font-weight="700">No tolerance band</text>
    <rect x="40" y="44" width="420" height="190" fill="#122335" rx="4"/>
    <line x1="66" y1="58" x2="66" y2="216" stroke="#8DA9C4" stroke-width="1.5"/>
    <line x1="66" y1="216" x2="448" y2="216" stroke="#8DA9C4" stroke-width="1.5"/>

    <line x1="66" y1="130" x2="448" y2="130" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="70" y="123" fill="#00E5FF" font-size="12" font-family="Space Mono, monospace">SETPOINT</text>

    <!-- the measured value arrives at the setpoint and then jitters on it -->
    <polyline points="66,205 110,160 140,133 152,127 160,133 168,127 176,133 184,127 192,133 200,127 208,133 216,127 224,133 232,127 240,133 248,127 256,133 264,127 272,133 280,127 288,133 296,127 304,133 312,127 320,133 328,127 336,133 344,127 352,133 360,127 368,133 376,127 384,133 392,127 400,133 408,127 416,133 424,127 432,133 440,129"
              fill="none" stroke="#FF6B6B" stroke-width="2.4" stroke-linejoin="round"/>

    <!-- switching marks -->
    <g stroke="#FFB347" stroke-width="1.6">
      <line x1="152" y1="180" x2="152" y2="208"/><line x1="168" y1="180" x2="168" y2="208"/>
      <line x1="184" y1="180" x2="184" y2="208"/><line x1="200" y1="180" x2="200" y2="208"/>
      <line x1="216" y1="180" x2="216" y2="208"/><line x1="232" y1="180" x2="232" y2="208"/>
      <line x1="248" y1="180" x2="248" y2="208"/><line x1="264" y1="180" x2="264" y2="208"/>
      <line x1="280" y1="180" x2="280" y2="208"/><line x1="296" y1="180" x2="296" y2="208"/>
      <line x1="312" y1="180" x2="312" y2="208"/><line x1="328" y1="180" x2="328" y2="208"/>
      <line x1="344" y1="180" x2="344" y2="208"/><line x1="360" y1="180" x2="360" y2="208"/>
      <line x1="376" y1="180" x2="376" y2="208"/><line x1="392" y1="180" x2="392" y2="208"/>
      <line x1="408" y1="180" x2="408" y2="208"/><line x1="424" y1="180" x2="424" y2="208"/>
    </g>
    <text x="70" y="228" fill="#FFB347" font-size="11.5" font-family="Space Mono, monospace">each mark = the actuator switching state</text>
    <text x="40" y="256" fill="#F0F6FF" font-size="13">Every tiny wobble across the line flips the actuator. Dozens of switches</text>
    <text x="40" y="276" fill="#F0F6FF" font-size="13">a minute, wearing out relays, motors and linkages for no benefit.</text>
  </g>

  <!-- ======================== right: with band ======================== -->
  <g>
    <text x="540" y="32" fill="#4ECDC4" font-size="15" font-weight="700">With a hysteresis band</text>
    <rect x="540" y="44" width="420" height="190" fill="#122335" rx="4"/>
    <line x1="566" y1="58" x2="566" y2="216" stroke="#8DA9C4" stroke-width="1.5"/>
    <line x1="566" y1="216" x2="948" y2="216" stroke="#8DA9C4" stroke-width="1.5"/>

    <!-- the band itself -->
    <rect x="566" y="112" width="382" height="36" fill="#00E5FF" fill-opacity="0.08"/>
    <line x1="566" y1="112" x2="948" y2="112" stroke="#4ECDC4" stroke-width="1.4" stroke-dasharray="5 4"/>
    <line x1="566" y1="148" x2="948" y2="148" stroke="#4ECDC4" stroke-width="1.4" stroke-dasharray="5 4"/>
    <line x1="566" y1="130" x2="948" y2="130" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="570" y="107" fill="#4ECDC4" font-size="11.5" font-family="Space Mono, monospace">UPPER EDGE</text>
    <text x="570" y="163" fill="#4ECDC4" font-size="11.5" font-family="Space Mono, monospace">LOWER EDGE</text>
    <text x="570" y="126" fill="#00E5FF" font-size="12" font-family="Space Mono, monospace">SETPOINT</text>

    <!-- slow sawtooth: no switching inside the band -->
    <polyline points="566,205 640,148 700,112 780,148 860,112 940,142"
              fill="none" stroke="#4ECDC4" stroke-width="2.6" stroke-linejoin="round"/>

    <g stroke="#FFB347" stroke-width="1.6">
      <line x1="700" y1="180" x2="700" y2="208"/>
      <line x1="780" y1="180" x2="780" y2="208"/>
      <line x1="860" y1="180" x2="860" y2="208"/>
    </g>
    <text x="570" y="228" fill="#FFB347" font-size="11.5" font-family="Space Mono, monospace">three switches over the same stretch of time</text>
    <text x="540" y="256" fill="#F0F6FF" font-size="13">Nothing switches while the value is inside the band. It runs past one edge,</text>
    <text x="540" y="276" fill="#F0F6FF" font-size="13">switches, runs back past the other edge, and switches again.</text>
  </g>

  <rect x="40" y="296" width="920" height="44" fill="#122335" rx="4"/>
  <text x="58" y="323" fill="#F0F6FF" font-size="13.5">The cost: the value is never exactly on the setpoint — it is always somewhere inside the band, or just past one of its edges.</text>
</svg>
