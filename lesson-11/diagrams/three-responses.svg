<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="Inter, sans-serif" role="img" aria-label="Three response curves: one swinging above and below the setpoint, one flattening out below it, and one settling on it.">
  <rect x="0" y="0" width="1000" height="340" fill="#0D1B2A"/>

  <!-- ============================= panel 1 ============================= -->
  <g>
    <rect x="30" y="30" width="280" height="214" fill="#122335" rx="4"/>
    <!-- axes -->
    <line x1="52" y1="44" x2="52" y2="226" stroke="#8DA9C4" stroke-width="1.5"/>
    <text x="40" y="135" fill="#8DA9C4" font-size="11.5" text-anchor="middle" transform="rotate(-90 40 135)">measured value →</text>
    <line x1="52" y1="226" x2="298" y2="226" stroke="#8DA9C4" stroke-width="1.5"/>
    <!-- setpoint -->
    <line x1="52" y1="120" x2="298" y2="120" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="6 5"/>
    <line x1="56" y1="48" x2="76" y2="48" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="82" y="52" fill="#00E5FF" font-size="12" font-family="Space Mono, monospace">SETPOINT</text>
    <!-- response: sharp swings straight through the setpoint, never settling -->
    <polyline points="52,218 78,120 92,74 118,120 132,166 158,120 172,74 198,120 212,166 238,120 252,74 278,120 292,150"
              fill="none" stroke="#FF6B6B" stroke-width="3" stroke-linejoin="round"/>
    <text x="175" y="243" fill="#8DA9C4" font-size="12" text-anchor="middle">time →</text>
  </g>

  <!-- ============================= panel 2 ============================= -->
  <g>
    <rect x="355" y="30" width="280" height="214" fill="#122335" rx="4"/>
    <line x1="377" y1="44" x2="377" y2="226" stroke="#8DA9C4" stroke-width="1.5"/>
    <text x="365" y="135" fill="#8DA9C4" font-size="11.5" text-anchor="middle" transform="rotate(-90 365 135)">measured value →</text>
    <line x1="377" y1="226" x2="623" y2="226" stroke="#8DA9C4" stroke-width="1.5"/>
    <line x1="377" y1="120" x2="623" y2="120" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="6 5"/>
    <line x1="381" y1="48" x2="401" y2="48" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="407" y="52" fill="#00E5FF" font-size="12" font-family="Space Mono, monospace">SETPOINT</text>
    <!-- response: rises, slows as the error shrinks, flattens out short of the line -->
    <path d="M377,218 C 405,218 425,175 455,158 C 490,140 520,152 560,152 L 617,152"
          fill="none" stroke="#FFB347" stroke-width="3"/>
    <!-- the permanent gap -->
    <line x1="592" y1="120" x2="592" y2="152" stroke="#F0F6FF" stroke-width="1.2"/>
    <line x1="587" y1="121" x2="597" y2="121" stroke="#F0F6FF" stroke-width="1.2"/>
    <line x1="587" y1="151" x2="597" y2="151" stroke="#F0F6FF" stroke-width="1.2"/>
    <text x="582" y="180" fill="#F0F6FF" font-size="11.5" text-anchor="end">a gap that never closes</text>
    <line x1="592" y1="156" x2="592" y2="170" stroke="#F0F6FF" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="500" y="243" fill="#8DA9C4" font-size="12" text-anchor="middle">time →</text>
  </g>

  <!-- ============================= panel 3 ============================= -->
  <g>
    <rect x="680" y="30" width="280" height="214" fill="#122335" rx="4"/>
    <line x1="702" y1="44" x2="702" y2="226" stroke="#8DA9C4" stroke-width="1.5"/>
    <text x="690" y="135" fill="#8DA9C4" font-size="11.5" text-anchor="middle" transform="rotate(-90 690 135)">measured value →</text>
    <line x1="702" y1="226" x2="948" y2="226" stroke="#8DA9C4" stroke-width="1.5"/>
    <line x1="702" y1="120" x2="948" y2="120" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="6 5"/>
    <line x1="706" y1="48" x2="726" y2="48" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="732" y="52" fill="#00E5FF" font-size="12" font-family="Space Mono, monospace">SETPOINT</text>
    <!-- response: fast rise, one small overshoot, then sits on the line -->
    <path d="M702,218 C 726,218 740,140 762,124 C 780,111 796,108 812,114 C 828,120 840,120 860,120 L 942,120"
          fill="none" stroke="#4ECDC4" stroke-width="3"/>
    <text x="825" y="243" fill="#8DA9C4" font-size="12" text-anchor="middle">time →</text>
  </g>

  <!-- ===================== label boxes (drop targets) ==================== -->
  <g stroke="#8DA9C4" stroke-width="1.6" stroke-dasharray="7 5" fill="none">
    <rect x="30" y="258" width="280" height="52" rx="4"/>
    <rect x="355" y="258" width="280" height="52" rx="4"/>
    <rect x="680" y="258" width="280" height="52" rx="4"/>
  </g>
  <g font-family="Space Mono, monospace" font-size="12" fill="#8DA9C4" text-anchor="middle">
    <text x="170" y="290">(a) — which algorithm?</text>
    <text x="495" y="290">(b) — which algorithm?</text>
    <text x="820" y="290">(c) — which algorithm?</text>
  </g>

  <text x="500" y="327" fill="#8DA9C4" font-size="12.5" text-anchor="middle">Each panel shows the measured value of one system over time, with the same setpoint.</text>
</svg>
