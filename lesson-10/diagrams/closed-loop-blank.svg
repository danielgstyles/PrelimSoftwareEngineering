<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Incomplete closed loop block diagram with two empty labelled boxes, (a) in the forward chain and (b) below it, waiting to be filled in">
  <defs>
    <marker id="arrb-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00E5FF"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="380" fill="#0D1B2A"/>

  <text x="30" y="40" font-family="'Space Mono', monospace" font-size="15" letter-spacing="3" fill="#00E5FF">CLOSE THE LOOP</text>

  <g>
    <rect x="30" y="80" width="150" height="92" fill="#122335" stroke="#0099BB" stroke-width="2" rx="3"/>
    <text x="105" y="118" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#F0F6FF">SETPOINT</text>
    <text x="105" y="142" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="12.5" fill="#8DA9C4">what you asked for</text>
  </g>

  <g>
    <rect x="215" y="80" width="200" height="92" fill="#122335" stroke="#FFB347" stroke-width="2.5" stroke-dasharray="8 6" rx="3"/>
    <text x="315" y="116" text-anchor="middle" font-family="'Space Mono', monospace" font-size="20" font-weight="700" fill="#FFB347">(a)</text>
    <text x="315" y="140" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" fill="#8DA9C4">drop a label here</text>
  </g>

  <g>
    <rect x="450" y="80" width="150" height="92" fill="#122335" stroke="#0099BB" stroke-width="2" rx="3"/>
    <text x="525" y="118" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#F0F6FF">CONTROLLER</text>
    <text x="525" y="142" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="12.5" fill="#8DA9C4">acts on the error</text>
  </g>
  <g>
    <rect x="635" y="80" width="150" height="92" fill="#122335" stroke="#0099BB" stroke-width="2" rx="3"/>
    <text x="710" y="118" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#F0F6FF">ACTUATOR</text>
    <text x="710" y="142" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="12.5" fill="#8DA9C4">does the action</text>
  </g>
  <g>
    <rect x="820" y="80" width="150" height="92" fill="#122335" stroke="#0099BB" stroke-width="2" rx="3"/>
    <text x="895" y="118" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#F0F6FF">OUTPUT</text>
    <text x="895" y="142" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="12.5" fill="#8DA9C4">what actually happened</text>
  </g>

  <line x1="182" y1="126" x2="211" y2="126" stroke="#00E5FF" stroke-width="2.5" marker-end="url(#arrb-cyan)"/>
  <line x1="417" y1="126" x2="446" y2="126" stroke="#00E5FF" stroke-width="2.5" marker-end="url(#arrb-cyan)"/>
  <line x1="602" y1="126" x2="631" y2="126" stroke="#00E5FF" stroke-width="2.5" marker-end="url(#arrb-cyan)"/>
  <line x1="787" y1="126" x2="816" y2="126" stroke="#00E5FF" stroke-width="2.5" marker-end="url(#arrb-cyan)"/>

  <g>
    <rect x="600" y="258" width="240" height="72" fill="#122335" stroke="#FFB347" stroke-width="2.5" stroke-dasharray="8 6" rx="3"/>
    <text x="720" y="292" text-anchor="middle" font-family="'Space Mono', monospace" font-size="20" font-weight="700" fill="#FFB347">(b)</text>
    <text x="720" y="314" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" fill="#8DA9C4">drop a label here</text>
  </g>

  <text x="330" y="290" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="14.5" fill="#8DA9C4">Two blocks are missing, and so is the</text>
  <text x="330" y="312" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="14.5" fill="#8DA9C4">path that carries the measurement back.</text>
</svg>
