<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Open loop block diagram: setpoint to controller to actuator to output, with no return path">
  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00E5FF"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="250" fill="#0D1B2A"/>

  <text x="30" y="38" font-family="'Space Mono', monospace" font-size="15" letter-spacing="3" fill="#00E5FF">OPEN LOOP CONTROL</text>

  <!-- boxes: x = 30, 280, 530, 780 ; w = 190 ; y = 76 ; h = 84 -->
  <g>
    <rect x="30" y="76" width="190" height="84" fill="#122335" stroke="#0099BB" stroke-width="2" rx="3"/>
    <text x="125" y="112" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#F0F6FF">SETPOINT</text>
    <text x="125" y="136" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" fill="#8DA9C4">what you asked for</text>
  </g>
  <g>
    <rect x="280" y="76" width="190" height="84" fill="#122335" stroke="#0099BB" stroke-width="2" rx="3"/>
    <text x="375" y="112" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#F0F6FF">CONTROLLER</text>
    <text x="375" y="136" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" fill="#8DA9C4">decides the action</text>
  </g>
  <g>
    <rect x="530" y="76" width="190" height="84" fill="#122335" stroke="#0099BB" stroke-width="2" rx="3"/>
    <text x="625" y="112" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#F0F6FF">ACTUATOR</text>
    <text x="625" y="136" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" fill="#8DA9C4">does the action</text>
  </g>
  <g>
    <rect x="780" y="76" width="190" height="84" fill="#122335" stroke="#0099BB" stroke-width="2" rx="3"/>
    <text x="875" y="112" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#F0F6FF">OUTPUT</text>
    <text x="875" y="136" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" fill="#8DA9C4">what actually happened</text>
  </g>

  <line x1="222" y1="118" x2="276" y2="118" stroke="#00E5FF" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>
  <line x1="472" y1="118" x2="526" y2="118" stroke="#00E5FF" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>
  <line x1="722" y1="118" x2="776" y2="118" stroke="#00E5FF" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>

  <text x="500" y="200" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" fill="#FFB347">No sensor measures the output. Nothing comes back.</text>
  <text x="500" y="224" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" fill="#8DA9C4">The control action does not depend on the output.</text>
</svg>
