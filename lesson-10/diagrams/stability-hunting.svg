<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Temperature against time for two closed loop systems: a well tuned one rises, overshoots slightly and settles on the setpoint, while a badly tuned one overshoots far past it and keeps oscillating">
  <rect x="0" y="0" width="900" height="400" fill="#0D1B2A"/>

  <text x="30" y="30" font-family="'Space Mono', monospace" font-size="15" letter-spacing="3" fill="#00E5FF">WHEN A CLOSED LOOP GOES UNSTABLE</text>

  <line x1="90" y1="46" x2="90" y2="310" stroke="#1E3A52" stroke-width="2"/>
  <line x1="90" y1="310" x2="862" y2="310" stroke="#1E3A52" stroke-width="2"/>

  <line x1="90" y1="160" x2="862" y2="160" stroke="#8DA9C4" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="100" y="152" font-family="'Space Mono', monospace" font-size="13" fill="#8DA9C4">setpoint</text>

  <polyline fill="none" stroke="#4ECDC4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    points="90,300 140,248 190,210 240,178 290,158 340,150 390,152 440,157 490,160 540,161 590,161 640,160 690,160 740,160 790,160 850,160"/>

  <polyline fill="none" stroke="#FF6B6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    points="90,300 130,279 170,236 210,179 250,124 290,81 330,58 370,59 410,81 450,117 490,159 530,198 570,225 610,238 650,232 690,211 730,182 770,150 810,124 850,106"/>

  <text x="46" y="180" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" fill="#8DA9C4" transform="rotate(-90 46 180)" text-anchor="middle">temperature</text>
  <text x="855" y="334" text-anchor="end" font-family="Inter, 'Segoe UI', sans-serif" font-size="13.5" fill="#8DA9C4">time →</text>

  <line x1="90" y1="364" x2="130" y2="364" stroke="#4ECDC4" stroke-width="3"/>
  <text x="140" y="369" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" fill="#F0F6FF">Well tuned — small overshoot, then settles</text>

  <line x1="470" y1="364" x2="510" y2="364" stroke="#FF6B6B" stroke-width="3"/>
  <text x="520" y="369" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" fill="#F0F6FF">Badly tuned — overshoots far, and keeps <tspan font-style="italic">hunting</tspan></text>
</svg>
