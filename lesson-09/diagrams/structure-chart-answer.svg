<svg viewBox="80 0 920 400" xmlns="http://www.w3.org/2000/svg" font-family="'Space Mono', monospace">
  <rect width="1000" height="400" fill="#0D1B2A" />

  <!-- Top box -->
  <rect x="380" y="16" width="240" height="46" rx="4" fill="#122335" stroke="#00E5FF" stroke-width="2" />
  <text x="500" y="45" fill="#F0F6FF" font-size="15" font-weight="700" text-anchor="middle">CONTROL ALGORITHM</text>

  <line x1="500" y1="62" x2="500" y2="86" stroke="#0099BB" stroke-width="2" />
  <line x1="250" y1="86" x2="700" y2="86" stroke="#0099BB" stroke-width="2" />
  <line x1="250" y1="86" x2="250" y2="106" stroke="#0099BB" stroke-width="2" />
  <line x1="700" y1="86" x2="700" y2="106" stroke="#0099BB" stroke-width="2" />

  <!-- Box (a) — filled -->
  <rect x="120" y="106" width="260" height="56" rx="4" fill="#12351F" stroke="#4ECDC4" stroke-width="2" />
  <text x="250" y="132" fill="#4ECDC4" font-size="10" font-weight="700" text-anchor="middle">(a)</text>
  <text x="250" y="150" fill="#F0F6FF" font-size="13" font-weight="700" text-anchor="middle">Set-up / Calibration</text>

  <!-- Main control loop box -->
  <rect x="570" y="106" width="260" height="56" rx="4" fill="#122335" stroke="#4ECDC4" stroke-width="2" />
  <text x="700" y="138" fill="#F0F6FF" font-size="14" font-weight="700" text-anchor="middle">Main control loop</text>
  <text x="700" y="154" fill="#4ECDC4" font-size="9" text-anchor="middle">GIVEN</text>

  <line x1="700" y1="162" x2="700" y2="186" stroke="#0099BB" stroke-width="2" />
  <line x1="520" y1="186" x2="880" y2="186" stroke="#0099BB" stroke-width="2" />
  <line x1="520" y1="186" x2="520" y2="206" stroke="#0099BB" stroke-width="2" />
  <line x1="700" y1="186" x2="700" y2="206" stroke="#0099BB" stroke-width="2" />
  <line x1="880" y1="186" x2="880" y2="206" stroke="#0099BB" stroke-width="2" />

  <!-- Box (b) — filled -->
  <rect x="440" y="206" width="160" height="56" rx="4" fill="#12351F" stroke="#4ECDC4" stroke-width="2" />
  <text x="520" y="230" fill="#4ECDC4" font-size="10" font-weight="700" text-anchor="middle">(b)</text>
  <text x="520" y="248" fill="#F0F6FF" font-size="13" font-weight="700" text-anchor="middle">Read sensors</text>

  <!-- Box (c) — filled -->
  <rect x="620" y="206" width="160" height="56" rx="4" fill="#12351F" stroke="#4ECDC4" stroke-width="2" />
  <text x="700" y="228" fill="#4ECDC4" font-size="10" font-weight="700" text-anchor="middle">(c)</text>
  <text x="700" y="240" fill="#F0F6FF" font-size="12" font-weight="700" text-anchor="middle">Compute control</text>
  <text x="700" y="253" fill="#F0F6FF" font-size="12" font-weight="700" text-anchor="middle">values</text>

  <!-- Output box — given -->
  <rect x="800" y="206" width="160" height="56" rx="4" fill="#122335" stroke="#4ECDC4" stroke-width="2" />
  <text x="880" y="230" fill="#F0F6FF" font-size="12" font-weight="700" text-anchor="middle">Output values</text>
  <text x="880" y="245" fill="#F0F6FF" font-size="12" font-weight="700" text-anchor="middle">to actuators</text>
  <text x="880" y="257" fill="#4ECDC4" font-size="9" text-anchor="middle">GIVEN</text>

  <!-- Diagnostic callout replacing the chip bank -->
  <rect x="90" y="298" width="820" height="70" rx="6" fill="#122335" stroke="#FFB347" stroke-width="1.5" />
  <text x="500" y="320" fill="#FFB347" font-size="12" font-weight="700" text-anchor="middle">Check yourself: how many times does each of these run?</text>
  <text x="500" y="340" fill="#F0F6FF" font-size="11" text-anchor="middle">(a) runs ONCE, at start-up. (b), (c) and Output run EVERY PASS of the loop — that's the level split that matters.</text>
  <text x="500" y="357" fill="#8DA9C4" font-size="10" text-anchor="middle">The common wrong answer draws all four lower boxes at the same level under CONTROL ALGORITHM.</text>
</svg>
